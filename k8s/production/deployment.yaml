apiVersion: apps/v1
kind: Deployment
metadata:
  name: oui-backend
  namespace: oui-production
  labels:
    app: oui-backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: oui-backend
  template:
    metadata:
      labels:
        app: oui-backend
        version: v1
    spec:
      containers:
      - name: oui-backend
        image: oui-backend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: jwt-secret
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1001
      serviceAccountName: oui-backend-sa

---
apiVersion: v1
kind: Service
metadata:
  name: oui-backend
  namespace: oui-production
  labels:
    app: oui-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: oui-backend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oui-api-ingress
  namespace: oui-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.oui.com
    secretName: oui-api-tls
  rules:
  - host: api.oui.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oui-backend
            port:
              number: 3000