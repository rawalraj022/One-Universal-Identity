apiVersion: apps/v1
kind: Deployment
metadata:
  name: oui-identity-platform
  namespace: oui-production
  labels:
    app: oui-identity-platform
    version: v3.0.0
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oui-identity-platform
  template:
    metadata:
      labels:
        app: oui-identity-platform
        version: v3.0.0
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: gcr.io/oui-project/backend:latest
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: redis-url
        - name: ETHEREUM_RPC_URL
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: ethereum-rpc-url
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: private-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: jwt-secret
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: encryption-key
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
          name: nginx-http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      securityContext:
        fsGroup: 1000
      serviceAccountName: oui-service-account
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oui-frontend
  namespace: oui-production
  labels:
    app: oui-frontend
    version: v3.0.0
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oui-frontend
  template:
    metadata:
      labels:
        app: oui-frontend
        version: v3.0.0
        component: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/oui-project/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REACT_APP_API_URL
          value: "http://backend.oui-production.svc.cluster.local:3001"
        - name: REACT_APP_ENVIRONMENT
          value: "production"
        - name: REACT_APP_VERSION
          value: "v3.0.0"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        fsGroup: 1000
      serviceAccountName: oui-service-account
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oui-hardhat-node
  namespace: oui-production
  labels:
    app: oui-hardhat-node
    version: v3.0.0
    component: blockchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oui-hardhat-node
  template:
    metadata:
      labels:
        app: oui-hardhat-node
        version: v3.0.0
        component: blockchain
    spec:
      containers:
      - name: hardhat-node
        image: gcr.io/oui-project/hardhat:latest
        ports:
        - containerPort: 8545
          name: rpc
        - containerPort: 8546
          name: websocket
        env:
        - name: NODE_ENV
          value: "production"
        - name: HARDHAT_NETWORK
          value: "mainnet"
        - name: BLOCK_TIME
          value: "3000"
        - name: ACCOUNTS_COUNT
          value: "20"
        command:
        - npx
        - hardhat
        - node
        - --hostname
        - 0.0.0.0
        - --port
        - "8545"
        livenessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:8545
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:8545
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: hardhat-data
          mountPath: /app/data
      volumes:
      - name: hardhat-data
        persistentVolumeClaim:
          claimName: hardhat-data-pvc
      securityContext:
        fsGroup: 1000
      serviceAccountName: oui-service-account
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oui-ai-service
  namespace: oui-production
  labels:
    app: oui-ai-service
    version: v3.0.0
    component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oui-ai-service
  template:
    metadata:
      labels:
        app: oui-ai-service
        version: v3.0.0
        component: ai
    spec:
      containers:
      - name: ai-service
        image: gcr.io/oui-project/ai-service:latest
        ports:
        - containerPort: 8001
          name: ai-api
        - containerPort: 8002
          name: ai-metrics
        env:
        - name: AI_MODEL_PATH
          value: "/models"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: oui-secrets
              key: redis-url
        - name: GPU_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: ai-models
          mountPath: /models
          readOnly: true
      volumes:
      - name: ai-models
        persistentVolumeClaim:
          claimName: ai-models-pvc
      securityContext:
        fsGroup: 1000
      serviceAccountName: oui-service-account
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        accelerator: nvidia-tesla-k80