name: Smart Contracts CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'hardhat.config.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'hardhat.config.ts'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Run contract tests
      run: npx hardhat test
      env:
        REPORT_GAS: true

    - name: Generate gas report
      run: npx hardhat run scripts/gas-reporter.js

    - name: Run security analysis
      run: |
        npm install -g @openzeppelin/solidity-analyzer
        solidity-analyzer contracts/

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          test-results/
          gas-report.txt

  security-audit:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Slither security analysis
      uses: crytic/slither-action@v0.3.0
      with:
        target: contracts/
        slither-config: slither.config.json

    - name: Run additional security checks
      run: |
        # Additional security checks can be added here
        echo "Additional security analysis completed"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy to Sepolia testnet
      run: npx hardhat run scripts/deploy.ts --network sepolia
      env:
        PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}
        INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}

    - name: Verify contracts on Etherscan
      run: npx hardhat run scripts/verify.ts --network sepolia
      env:
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts-staging
        path: |
          deployments/
          contracts/

  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy to Ethereum mainnet
      run: npx hardhat run scripts/deploy.ts --network mainnet
      env:
        PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}
        INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}

    - name: Verify contracts on Etherscan
      run: npx hardhat run scripts/verify.ts --network mainnet
      env:
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Update contract addresses
      run: |
        node scripts/update-addresses.js
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add deployments/
        git commit -m "Update contract addresses [skip ci]"
        git push

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts-production
        path: |
          deployments/
          contracts/

    - name: Notify deployment
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"🚀 OUI Smart Contracts deployed to mainnet!"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}