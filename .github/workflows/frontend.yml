name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/frontend/**'
      - 'src/mobile-sdk/**'
      - 'package.json'
      - 'webpack.config.js'
      - 'babel.config.js'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/frontend/**'
      - 'src/mobile-sdk/**'
      - 'package.json'

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript compilation check
      run: npx tsc --noEmit --project src/frontend/tsconfig.json

    - name: Run ESLint
      run: npx eslint src/frontend/ src/mobile-sdk/ --ext .ts,.tsx

    - name: Run frontend tests
      run: npm run test:frontend
      env:
        CI: true

    - name: Build frontend
      run: npm run build:frontend

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: dist/frontend/

  test-mobile-sdk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript compilation check for mobile SDK
      run: npx tsc --noEmit src/mobile-sdk/*.ts

    - name: Run mobile SDK tests
      run: npm run test:mobile

    - name: Build mobile SDK
      run: npm run build:mobile

    - name: Upload mobile SDK artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mobile-sdk-build
        path: dist/mobile-sdk/

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-mobile-sdk]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download frontend build
      uses: actions/download-artifact@v3
      with:
        name: frontend-build

    - name: Download mobile SDK build
      uses: actions/download-artifact@v3
      with:
        name: mobile-sdk-build

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Create production build
      run: |
        npm ci --production=false
        npm run build

    - name: Build Docker image
      run: |
        docker build -t oui-frontend:${{ github.sha }} -f Dockerfile.frontend .
        docker tag oui-frontend:${{ github.sha }} oui-frontend:latest

    - name: Save Docker image
      run: |
        docker save oui-frontend:latest > frontend-image.tar
        docker save oui-frontend:${{ github.sha }} > frontend-image-${{ github.sha }}.tar

    - name: Upload Docker images
      uses: actions/upload-artifact@v3
      with:
        name: frontend-docker-images
        path: |
          frontend-image.tar
          frontend-image-${{ github.sha }}.tar

  lighthouse-audit:
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download Docker images
      uses: actions/download-artifact@v3
      with:
        name: frontend-docker-images

    - name: Load Docker image
      run: docker load < frontend-image.tar

    - name: Run Lighthouse audit
      run: |
        docker run -d -p 3000:3000 --name oui-frontend oui-frontend:latest
        sleep 10
        npx lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-report.json
        docker stop oui-frontend
        docker rm oui-frontend

    - name: Upload Lighthouse report
      uses: actions/upload-artifact@v3
      with:
        name: lighthouse-report
        path: lighthouse-report.json

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-docker, lighthouse-audit]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download Docker images
      uses: actions/download-artifact@v3
      with:
        name: frontend-docker-images

    - name: Load Docker image
      run: docker load < frontend-image.tar

    - name: Deploy to staging
      run: |
        echo "Deploying frontend to staging..."
        # Add your staging deployment commands
        # Example: aws s3 sync dist/ s3://oui-staging --delete
        # Example: gcloud app deploy --version=staging
        echo "Staging deployment completed"

    - name: Run E2E tests on staging
      run: |
        echo "Running E2E tests on staging..."
        # Add E2E test commands here
        # Example: npx cypress run --config baseUrl=https://staging.oui.com
        echo "E2E tests completed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-docker, lighthouse-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download Docker images
      uses: actions/download-artifact@v3
      with:
        name: frontend-docker-images

    - name: Load Docker image
      run: docker load < frontend-image.tar

    - name: Deploy to production
      run: |
        echo "Deploying frontend to production..."
        # Add your production deployment commands
        # Example: aws s3 sync dist/ s3://oui-production --delete
        # Example: gcloud app deploy --version=production
        echo "Production deployment completed"

    - name: Invalidate CDN cache
      run: |
        echo "Invalidating CDN cache..."
        # Add CDN invalidation commands
        # Example: aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
        echo "CDN cache invalidated"

    - name: Health check
      run: |
        echo "Running production health checks..."
        # Add health check commands
        echo "Health checks passed"

    - name: Notify deployment
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"🚀 OUI Frontend deployed to production!"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}